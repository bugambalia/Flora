name: Release APK & GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version label for manual artifact (e.g. v1.0)'
        required: false
        default: 'v1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve version label
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Faltan secrets de firma en GitHub (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD)."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          SDK_MANAGER=$(command -v sdkmanager || find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Ensure debug keystore
        run: |
          if [ ! -s debug.keystore ]; then
            if [ -s debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore || rm -f debug.keystore
            fi
            if [ ! -s debug.keystore ]; then
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.ExampleUnitTest" --no-daemon

      - name: Run Robolectric tests (best-effort)
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --tests "com.example.ExampleRobolectricTest" --no-daemon

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "${{ runner.temp }}/upload-key.jks"

      - name: Build signed Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon

      - name: Package release assets and SHA-256
        id: assets
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/Flora-${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-assets/Flora-${VERSION}.aab"
          (
            cd release-assets
            sha256sum "Flora-${VERSION}.apk" > "Flora-${VERSION}.apk.sha256"
          )
          cat "release-assets/Flora-${VERSION}.apk.sha256"

      - name: Clean temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/upload-key.jks"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: flora-release-${{ steps.meta.outputs.version }}
          path: release-assets/*
          retention-days: 30

      - name: Extract release notes from CHANGELOG.md
        if: steps.meta.outputs.is_tag == 'true'
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          python3 - "$VERSION" "$VERSION_NO_V" << 'PY'
          import re, sys, pathlib
          version, version_no_v = sys.argv[1], sys.argv[2]
          changelog = pathlib.Path("CHANGELOG.md")
          out = pathlib.Path("release-notes.md")
          extracted = ""
          if changelog.exists():
              text = changelog.read_text(encoding="utf-8")
              pattern = re.compile(
                  rf"^##\s+\[(?:{re.escape(version)}|{re.escape(version_no_v)})\][^\n]*\n(.*?)(?=^##\s+\[|\Z)",
                  re.MULTILINE | re.DOTALL,
              )
              m = pattern.search(text)
              if m:
                  extracted = m.group(1).strip()
          lines = []
          if extracted:
              lines.append(extracted)
              lines.append("")
          lines.extend([
              "---",
              f"### Verificación de integridad (`{version}`)",
              "```bash",
              f"sha256sum -c Flora-{version}.apk.sha256",
              "```",
              "",
              "Consulta el historial completo en el [Portal de Releases & Changelog](https://bugambalia.github.io/Flora/) o en [`CHANGELOG.md`](CHANGELOG.md).",
          ])
          out.write_text("\n".join(lines).strip() + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        if: steps.meta.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: "Flora ${{ steps.meta.outputs.version }}"
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            release-assets/Flora-${{ steps.meta.outputs.version }}.apk
            release-assets/Flora-${{ steps.meta.outputs.version }}.apk.sha256
            release-assets/Flora-${{ steps.meta.outputs.version }}.aab
